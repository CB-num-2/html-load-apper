<style>
	body {
		margin: 0px;
		padding: 0px;
		background-color: black;
	}
	arbs {
		background-color: white;
		border-radius: 2px;
		width: 20px;
		height: 20px;
	}
</style>
<div id="editor">
<body>
	
	<div style="background-color: grey; padding: 2px;">
		<h4>EDITOR</h4><button id="pm1" group="arbs">+</button><button id="pm2" group="arbs">-</button><input id="pm3" placeholder="Filepath Here"><button>Submit</button><button>Close</button>
	</div>
	<br>
	<div id="fileexplorer" style="position: absolute; top: 106px; left: 0px; padding: 2px; background-color: grey; width: 350px; height: 598px;">
	</div>
	<div style="position: absolute; top: 106px; left: 360px; padding: 2px; background-color: grey;">
		<textarea style="width:833px; height: 598px; resize: none;"></textarea>
	</div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const pm1Btn = document.getElementById('pm1');
    const pm3Input = document.getElementById('pm3');
    const fileexplorerDiv = document.getElementById('fileexplorer');

    if (pm1Btn && pm3Input && fileexplorerDiv) {
        pm1Btn.addEventListener('click', () => {
            const pathValue = pm3Input.value.trim();
            if (pathValue === '') return;

            const pathParts = pathValue.split('/').filter(part => part.length > 0);
            if (pathParts.length === 0) return;

            let currentContainer = fileexplorerDiv;

            pathParts.forEach((part, index) => {
                const isLast = index === pathParts.length - 1;

                if (!isLast) {
                    let existingFolder = currentContainer.querySelector(`[data-folder-name="${part}"]`);
                    
                    if (!existingFolder) {
                        const folderWrapper = document.createElement('div');
                        folderWrapper.setAttribute('data-folder-name', part);
                        folderWrapper.style.paddingLeft = '10px';
                        folderWrapper.style.margin = '2px 0';

                        const folderHeader = document.createElement('div');
                        folderHeader.textContent = `📁 ${part}`;
                        folderHeader.style.fontWeight = 'bold';
                        folderHeader.style.cursor = 'pointer';

                        const folderContent = document.createElement('div');
                        folderContent.style.display = 'block';

                        folderHeader.addEventListener('click', () => {
                            if (folderContent.style.display === 'none') {
                                folderContent.style.display = 'block';
                            } else {
                                folderContent.style.display = 'none';
                            }
                        });

                        folderWrapper.appendChild(folderHeader);
                        folderWrapper.appendChild(folderContent);
                        currentContainer.appendChild(folderWrapper);
                        
                        currentContainer = folderContent;
                    } else {
                        currentContainer = existingFolder.lastElementChild;
                    }
                } else {
                    const newFileButton = document.createElement('button');
                    newFileButton.textContent = pathValue.includes('/') ? `📄 ${part}` : part;
                    
                    newFileButton.style.display = 'block';
                    newFileButton.style.width = '100%';
                    newFileButton.style.textAlign = 'left';
                    newFileButton.style.margin = '2px 0';
                    newFileButton.setAttribute('data-filepath', pathValue);

                    currentContainer.appendChild(newFileButton);
                }
            });

            pm3Input.value = '';
        });
    }
});
</script>
