<style>
	body {
		margin: 0px;
		padding: 0px;
		background-color: black;
	}
	arbs {
		background-color: white;
		border-radius: 2px;
		width: 20px;
		height: 20px;
	}
</style>
<div id="editor">
<body>
	
	<div style="background-color: grey; padding: 2px;">
		<h4>EDITOR</h4><button id="pm1" group="arbs">+</button><button id="pm2" group="arbs">-</button><input id="pm3" placeholder="Filepath Here"><button>Submit</button><button>Close</button>
	</div>
	<br>
	<div id="fileexplorer" style="position: absolute; top: 106px; left: 0px; padding: 2px; background-color: grey; width: 350px; height: 598px;">
		<button id="back"><-</button><button id="forward">-></button>
	</div>
	<div style="position: absolute; top: 106px; left: 360px; padding: 2px; background-color: grey; overflow-y: scroll; overflow-x: scroll;">
		<textarea style="width:833px; height: 598px; resize: none;"></textarea>
	</div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const pm1Btn = document.getElementById('pm1');
    const pm3Input = document.getElementById('pm3');
    const fileexplorerDiv = document.getElementById('fileexplorer');
    const backBtn = document.getElementById('back');
    const forwardBtn = document.getElementById('forward');

    const fsRoot = { type: 'folder', children: {} };
    let currentPath = [];
    let historyStack = [[]];
    let historyIndex = 0;

    if (fileexplorerDiv) {
        fileexplorerDiv.style.overflowY = 'auto';
        fileexplorerDiv.style.overflowX = 'hidden';
        fileexplorerDiv.style.maxHeight = '598px';
        fileexplorerDiv.style.boxSizing = 'border-box';
    }

    function render() {
        if (!fileexplorerDiv) return;
        fileexplorerDiv.innerHTML = '';

        let folder = fsRoot;
        for (const part of currentPath) {
            if (folder && folder.children[part] && folder.children[part].type === 'folder') {
                folder = folder.children[part];
            } else {
                currentPath = [];
                folder = fsRoot;
                break;
            }
        }

        for (const name in folder.children) {
            const item = folder.children[name];
            const btn = document.createElement('button');
            btn.style.display = 'block';
            btn.style.width = '100%';
            btn.style.textAlign = 'left';
            btn.style.margin = '2px 0';
            btn.style.boxSizing = 'border-box';

            if (item.type === 'folder') {
                btn.textContent = `📁 ${name}`;
                btn.addEventListener('click', () => {
                    const newPath = [...currentPath, name];
                    historyStack = historyStack.slice(0, historyIndex + 1);
                    historyStack.push(newPath);
                    historyIndex = historyStack.length - 1;
                    currentPath = newPath;
                    render();
                });
            } else {
                btn.textContent = `📄 ${name}`;
                btn.setAttribute('data-filepath', item.fullPath);
            }
            fileexplorerDiv.appendChild(btn);
        }

        if (backBtn) {
            backBtn.disabled = historyIndex === 0;
        }
        if (forwardBtn) {
            forwardBtn.disabled = historyIndex === historyStack.length - 1;
        }
    }

    if (backBtn) {
        backBtn.addEventListener('click', () => {
            if (historyIndex > 0) {
                historyIndex--;
                currentPath = historyStack[historyIndex];
                render();
            }
        });
    }

    if (forwardBtn) {
        forwardBtn.addEventListener('click', () => {
            if (historyIndex < historyStack.length - 1) {
                historyIndex++;
                currentPath = historyStack[historyIndex];
                render();
            }
        });
    }

    if (pm1Btn && pm3Input && fileexplorerDiv) {
        pm1Btn.addEventListener('click', () => {
            const pathValue = pm3Input.value.trim();
            if (pathValue === '') return;

            const pathParts = pathValue.split('/').filter(part => part.length > 0);
            if (pathParts.length === 0) return;

            let activeFolder = fsRoot;

            pathParts.forEach((part, index) => {
                const isLast = index === pathParts.length - 1;

                if (!isLast) {
                    if (!activeFolder.children[part]) {
                        activeFolder.children[part] = {
                            type: 'folder',
                            children: {}
                        };
                    }
                    activeFolder = activeFolder.children[part];
                } else {
                    if (!activeFolder.children[part]) {
                        activeFolder.children[part] = {
                            type: 'file',
                            fullPath: pathValue
                        };
                    }
                }
            });

            pm3Input.value = '';
            render();
        });
    }

    render();
});
</script>
