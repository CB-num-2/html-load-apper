<style>
	body {
		margin: 0px;
		padding: 0px;
		background-color: black;
	}
	arbs {
		background-color: white;
		border-radius: 2px;
		width: 20px;
		height: 20px;
	}
</style>
<div id="editor">
<body>
	
	<div style="background-color: grey; padding: 2px;">
		<h4>EDITOR</h4><button id="pm1" group="arbs">+</button><button id="pm2" group="arbs">-</button><input id="pm3" placeholder="Filepath Here"><button>Submit</button><button>Close</button>
	</div>
	<br>
	<div id="fileexplorer" style="position: absolute; top: 44.5px; left: 0px; padding: 2px; background-color: grey; width: 350px; height: 598px;">
	</div>
	<div style="position: absolute; top: 106px; left: 360px; padding: 2px; background-color: grey;">
		<textarea style="width:833px; height: 598px; resize: none;"></textarea>
	</div>
</div>
<script>
let ctrlAltComboCount = 0;
let lastComboTime = 0;

document.addEventListener('DOMContentLoaded', () => {
    const pm1Btn = document.getElementById('pm1');
    const pm3Input = document.getElementById('pm3');
    const fileexplorerDiv = document.getElementById('fileexplorer');

    if (pm1Btn && pm3Input && fileexplorerDiv) {
        pm1Btn.addEventListener('click', () => {
            const pathValue = pm3Input.value.trim();
            if (pathValue === '') return;

            const newFileButton = document.createElement('button');
            newFileButton.textContent = pathValue;
            
            newFileButton.style.display = 'block';
            newFileButton.style.width = '100%';
            newFileButton.style.textAlign = 'left';
            newFileButton.style.margin = '2px 0';

            fileexplorerDiv.appendChild(newFileButton);
            pm3Input.value = '';
        });
    }
});

window.addEventListener('keydown', function(event) {
    if (event.ctrlKey && event.altKey) {
        const processTimestamp = Date.now();
        
        if (processTimestamp - lastComboTime > 1200) {
            ctrlAltComboCount = 0;
        }

        if (event.key === 'Control' || event.key === 'Alt') {
            ctrlAltComboCount++;
            lastComboTime = processTimestamp;

            if (ctrlAltComboCount >= 3) {
                const overlayInstance = document.getElementById('editor');
                if (overlayInstance) {
                    if (overlayInstance.style.display === 'none' || !overlayInstance.classList.contains('active')) {
                        overlayInstance.style.display = 'block';
                        overlayInstance.classList.add('active');
                    } else {
                        overlayInstance.style.display = 'none';
                        overlayInstance.classList.remove('active');
                    }
                }
                ctrlAltComboCount = 0;
            }
        }
    }
});

</script>
