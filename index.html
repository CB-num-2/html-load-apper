<style>
	body {
		margin: 0px;
		padding: 0px;
		background-color: black;
	}
	arbs {
		background-color: white;
		border-radius: 2px;
		width: 20px;
		height: 20px;
	}
</style>
<div id="editor">
<body>
	
	<div style="background-color: grey; padding: 2px;">
		<h4>EDITOR</h4><button id="pm1" group="arbs">+</button><button id="pm2" group="arbs">-</button><input id="pm3" placeholder="Filepath Here"><button>Submit</button><button>Close</button>
	</div>
	<br>
	<div style="background-color: grey; padding: 2px; width: 350px;">
		<button id="up">/\</button><button id="down">\/</button><br>
		<button style="height:64px; width:256px;" id="f3" group="arbs">EMPTY</button><br>
		<button style="height:64px; width:256px;" id="f4" group="arbs">EMPTY</button><br>
		<button style="height:64px; width:256px;" id="f5" group="arbs">EMPTY</button><br>
		<button style="height:64px; width:256px;" id="f6" group="arbs">EMPTY</button><br>
		<button style="height:64px; width:256px;" id="f7" group="arbs">EMPTY</button><br>
		<button style="height:64px; width:256px;" id="f8" group="arbs">EMPTY</button><br>
		<button style="height:64px; width:256px;" id="f9" group="arbs">EMPTY</button><br>
		<button style="height:64px; width:256px;" id="f10" group="arbs">EMPTY</button><br>
		<button style="height:64px; width:256px;" id="f11" group="arbs">EMPTY</button>
	</div>
	<div style="position: absolute; top: 106px; left: 360px; padding: 2px; background-color: grey;">
		<textarea style="width:833px; height: 598px; resize: none;"></textarea>
	</div>
</div>
<script>
let ctrlAltComboCount = 0;
let lastComboTime = 0;
let pendingFilesData = [];
let systemFileCache = [];

let currentLevel = 1;
const maxLevel = 10;
const minLevel = 1;

let virtualFileSystem = {};

window.openToolkit = function() {
    const overlayInstance = document.getElementById('editor');
    if (overlayInstance) {
        overlayInstance.classList.add('active');
        const textEntryBox = document.querySelector('#editor textarea');
        if (textEntryBox) textEntryBox.focus();
    }
};

window.closeToolkit = function() {
    const overlayInstance = document.getElementById('editor');
    if (overlayInstance) {
        overlayInstance.classList.remove('active');
    }
    const fileUploadInputElement = document.getElementById('pm3');
    if (fileUploadInputElement) fileUploadInputElement.value = '';
    
    pendingFilesData = [];
};

window.toggleToolkit = function() {
    const overlayInstance = document.getElementById('editor');
    if (overlayInstance) {
        if (overlayInstance.classList.contains('active')) {
            window.closeToolkit();
        } else {
            window.openToolkit();
        }
    }
};

window.createFileOrFolderEntity = function(pathString, fileContent) {
    if (!pathString || pathString.trim() === "") return;
    
    const cleanPath = pathString.replace(/^\/+|\/+$/g, '');
    const pathParts = cleanPath.split('/');
    
    let currentDir = virtualFileSystem;
    
    for (let i = 0; i < pathParts.length; i++) {
        const currentPart = pathParts[i];
        
        if (i === pathParts.length - 1) {
            if (currentPart.includes('.')) {
                currentDir[currentPart] = {
                    type: 'file',
                    content: fileContent || '',
                    size: (new Blob([fileContent || '']).size / 1024).toFixed(1) + ' KB',
                    mime: 'text/plain'
                };
            } else {
                if (!currentDir[currentPart] || typeof currentDir[currentPart] !== 'object' || currentDir[currentPart].type === 'file') {
                    currentDir[currentPart] = {
                        type: 'directory',
                        children: {}
                    };
                }
            }
        } else {
            if (!currentDir[currentPart] || typeof currentDir[currentPart] !== 'object' || currentDir[currentPart].type === 'file') {
                currentDir[currentPart] = {
                    type: 'directory',
                    children: {}
                };
            }
            currentDir = currentDir[currentPart].children;
        }
    }
    
    window.syncVirtualSystemToCache();
};

window.syncVirtualSystemToCache = function() {
    systemFileCache = [];
    
    function traverseTree(dirObj, accumulatedPath) {
        for (const key in dirObj) {
            const currentPath = accumulatedPath ? `${accumulatedPath}/${key}` : key;
            const node = dirObj[key];
            
            if (node.type === 'file') {
                systemFileCache.push({
                    name: currentPath,
                    size: node.size,
                    type: node.mime,
                    content: node.content
                });
            } else if (node.type === 'directory') {
                systemFileCache.push({
                    name: `${currentPath}/`,
                    size: '0 KB',
                    type: 'directory',
                    content: '[ Virtual Directory Container ]'
                });
                traverseTree(node.children, currentPath);
            }
        }
    }
    
    traverseTree(virtualFileSystem, "");
    window.renderWorkspaceDashboardCards();
};

window.removeFileOrFolderEntity = function(pathString) {
    if (!pathString || pathString.trim() === "") return false;
    
    const cleanPath = pathString.replace(/^\/+|\/+$/g, '');
    const pathParts = cleanPath.split('/');
    
    let currentDir = virtualFileSystem;
    
    for (let i = 0; i < pathParts.length - 1; i++) {
        const currentPart = pathParts[i];
        if (currentDir[currentPart] && currentDir[currentPart].type === 'directory') {
            currentDir = currentDir[currentPart].children;
        } else {
            return false;
        }
    }
    
    const targetKey = pathParts[pathParts.length - 1];
    if (currentDir[targetKey] !== undefined) {
        delete currentDir[targetKey];
        window.syncVirtualSystemToCache();
        return true;
    }
    
    return false;
};

window.saveToSlot = function(slotId, textValue) {
    const storageKeyIdentifier = `dev_toolkit_slot_L${currentLevel}_${slotId}`;
    localStorage.setItem(storageKeyIdentifier, textValue);
};

window.loadFromSlot = function(slotId) {
    const storageKeyIdentifier = `dev_toolkit_slot_L${currentLevel}_${slotId}`;
    const retrievedValueString = localStorage.getItem(storageKeyIdentifier);
    
    const textEntryBox = document.querySelector('#editor textarea');
    if (!textEntryBox) return null;

    if (retrievedValueString !== null) {
        textEntryBox.value = retrievedValueString;
        return retrievedValueString;
    } else {
        textEntryBox.value = '';
        return '';
    }
};

window.changeLevel = function(direction) {
    if (direction === 'up' && currentLevel < maxLevel) {
        currentLevel++;
    } else if (direction === 'down' && currentLevel > minLevel) {
        currentLevel--;
    }
};

window.addFileToBuffer = function(fileName, fileSizeFormatted, fileMimeType, assetTextContent) {
    pendingFilesData.push({
        name: fileName,
        size: fileSizeFormatted,
        type: fileMimeType,
        content: assetTextContent
    });
};

window.submitBufferToCache = function(explicitTextAreaContentOverride) {
    let stateVerificationPassed = false;
    let targetedInputText = "";

    if (explicitTextAreaContentOverride !== undefined) {
        targetedInputText = explicitTextAreaContentOverride;
    } else {
        const textEntryBox = document.querySelector('#editor textarea');
        if (textEntryBox) targetedInputText = textEntryBox.value;
    }

    if (targetedInputText && targetedInputText.trim() !== "") {
        const autoFileName = `snippet_${new Date().getTime()}.js`;
        window.createFileOrFolderEntity(autoFileName, targetedInputText);
        stateVerificationPassed = true;
    }

    if (pendingFilesData.length > 0) {
        pendingFilesData.forEach(file => {
            window.createFileOrFolderEntity(file.name, file.content);
        });
        stateVerificationPassed = true;
    }

    if (!stateVerificationPassed) {
        return false;
    }

    const textEntryBox = document.querySelector('#editor textarea');
    if (textEntryBox) textEntryBox.value = '';
    
    window.closeToolkit();
    return true;
};

window.renderWorkspaceDashboardCards = function() {
    const displayContainerWrapper = document.getElementById('displayContainer');
    const fileGridContainer = document.getElementById('fileGrid');
    if (!displayContainerWrapper || !fileGridContainer) return;

    if (systemFileCache.length === 0) {
        displayContainerWrapper.style.display = 'none';
        return;
    }

    displayContainerWrapper.style.display = 'block';
    fileGridContainer.innerHTML = ''; 

    systemFileCache.forEach(fileObject => {
        const cardNode = document.createElement('div');
        cardNode.className = 'file-card';

        const titleElement = document.createElement('h3');
        titleElement.textContent = fileObject.name;

        const metaElement = document.createElement('div');
        metaElement.className = 'file-meta';
        metaElement.textContent = `${fileObject.type} | ${fileObject.size}`;

        const previewNode = document.createElement('div');
        previewNode.className = 'file-content-preview';
        previewNode.textContent = fileObject.content || '[ Empty Data Payload ]';

        cardNode.appendChild(titleElement);
        cardNode.appendChild(metaElement);
        cardNode.appendChild(previewNode);
        fileGridContainer.appendChild(cardNode);
    });
};

document.addEventListener('DOMContentLoaded', () => {
    const editorOverlay = document.getElementById('editor');
    
    if (editorOverlay) {
        const closeBtn = editorOverlay.querySelector('button:nth-of-type(4)');
        if (closeBtn) closeBtn.addEventListener('click', window.closeToolkit);

        const submitBtn = editorOverlay.querySelector('button:nth-of-type(3)');
        if (submitBtn) submitBtn.addEventListener('click', () => window.submitBufferToCache());

        const pm1Btn = document.getElementById('pm1');
        if (pm1Btn) {
            pm1Btn.addEventListener('click', () => {
                const pathInput = document.getElementById('pm3');
                const textarea = editorOverlay.querySelector('textarea');
                if (pathInput && pathInput.value.trim() !== "") {
                    window.createFileOrFolderEntity(pathInput.value, textarea ? textarea.value : '');
                    pathInput.value = '';
                }
            });
        }

        const pm2Btn = document.getElementById('pm2');
        if (pm2Btn) {
            pm2Btn.addEventListener('click', () => {
                const pathInput = document.getElementById('pm3');
                if (pathInput && pathInput.value.trim() !== "") {
                    const confirmation = confirm("Are you sure you want to delete this file? [YES] [NO]");
                    if (confirmation) {
                        window.removeFileOrFolderEntity(pathInput.value);
                        pathInput.value = '';
                    }
                }
            });
        }

        const slotIds = ['f3', 'f4', 'f5', 'f6', 'f7', 'f8', 'f9', 'f10', 'f11'];
        slotIds.forEach(id => {
            const btn = document.getElementById(id);
            if (btn) {
                btn.addEventListener('click', () => {
                    const textarea = editorOverlay.querySelector('textarea');
                    if (textarea && textarea.value.trim() !== '') {
                        window.saveToSlot(id, textarea.value);
                    } else {
                        window.loadFromSlot(id);
                    }
                });
            }
        });

        const upBtn = document.getElementById('up');
        if (upBtn) {
            upBtn.addEventListener('click', () => {
                window.changeLevel('up');
            });
        }

        const downBtn = document.getElementById('down');
        if (downBtn) {
            downBtn.addEventListener('click', () => {
                window.changeLevel('down');
            });
        }
    }

    const fileUploader = document.getElementById('pm3');
    if (fileUploader && fileUploader.type === 'file') {
        fileUploader.addEventListener('change', function(e) {
            const fileCollection = e.target.files;
            pendingFilesData = [];
            
            Array.from(fileCollection).forEach(individualFile => {
                const asyncFileReader = new FileReader();
                asyncFileReader.onload = function(loadEvent) {
                    pendingFilesData.push({
                        name: individualFile.name,
                        size: (individualFile.size / 1024).toFixed(1) + ' KB',
                        type: individualFile.type || 'text/plain',
                        content: loadEvent.target.result
                    });
                };
                asyncFileReader.readAsText(individualFile);
            });
        });
    }
});

window.addEventListener('keydown', function(event) {
    if (event.ctrlKey && event.altKey) {
        const processTimestamp = Date.now();
        
        if (processTimestamp - lastComboTime > 1200) {
            ctrlAltComboCount = 0;
        }

        if (event.key === 'Control' || event.key === 'Alt') {
            ctrlAltComboCount++;
            lastComboTime = processTimestamp;

            if (ctrlAltComboCount >= 3) {
                window.toggleToolkit();
                ctrlAltComboCount = 0; 
            }
        }
    }
});

</script>
